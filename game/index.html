<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111424">
  <title>AMPED: From Garage to Glory</title>
  <link rel="icon" href="assets/brand/amped-app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Title -->
  <section class="title-screen" id="title" aria-labelledby="title-heading">
    <img class="title-art" src="assets/world/keyart-garage.webp" alt="">
    <div class="title-panel">
      <h1 id="title-heading"><img class="wordmark" src="assets/brand/amped-wordmark-primary.svg" alt="AMPED"></h1>
      <p class="title-tag">From garage to glory.</p>
      <button class="btn btn-primary" id="title-continue" type="button">Continue</button>
      <button class="btn" id="title-new" type="button">New game</button>
    </div>
  </section>

  <div class="app" id="app" hidden>
    <header class="app-head" id="app-head">
      <div>
        <span class="eyebrow" id="head-eyebrow"></span>
        <h1 class="head-title" id="head-title"></h1>
      </div>
      <button class="icon-btn" id="open-settings" type="button" aria-label="Settings">
        <span class="icon" style="-webkit-mask-image:url(assets/icons/settings.svg);mask-image:url(assets/icons/settings.svg)"></span>
      </button>
    </header>

    <ul class="resources" id="resources" aria-label="Band resources"></ul>

    <main class="view" id="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Main">
      <button type="button" data-tab="hq"><span class="icon" style="-webkit-mask-image:url(assets/icons/hq.svg);mask-image:url(assets/icons/hq.svg)"></span>HQ</button>
      <button type="button" data-tab="band"><span class="icon" style="-webkit-mask-image:url(assets/icons/crew.svg);mask-image:url(assets/icons/crew.svg)"></span>Band</button>
      <button type="button" data-tab="map"><span class="icon" style="-webkit-mask-image:url(assets/icons/map.svg);mask-image:url(assets/icons/map.svg)"></span>Map</button>
      <button type="button" data-tab="music"><span class="icon" style="-webkit-mask-image:url(assets/icons/record.svg);mask-image:url(assets/icons/record.svg)"></span>Music</button>
      <button type="button" data-tab="shop"><span class="icon" style="-webkit-mask-image:url(assets/icons/shop.svg);mask-image:url(assets/icons/shop.svg)"></span>Shop</button>
    </nav>
  </div>

  <!-- Full-screen gig -->
  <div class="stage-layer" id="stage-layer" hidden></div>

  <dialog class="sheet" id="member-sheet" aria-labelledby="member-name"></dialog>
  <dialog class="sheet" id="wardrobe-sheet" aria-labelledby="wardrobe-title"></dialog>
  <dialog class="sheet" id="venue-sheet" aria-labelledby="venue-name"></dialog>
  <dialog class="sheet" id="band-sheet" aria-labelledby="band-title"></dialog>
  <dialog class="sheet" id="settings-sheet" aria-labelledby="settings-title"></dialog>
  <dialog class="sheet" id="calibrate-sheet" aria-labelledby="calibrate-title"></dialog>
  <dialog class="sheet" id="confirm-sheet" aria-labelledby="confirm-title"></dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/composer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/director.js"></script>
  <script src="js/rhythm.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
