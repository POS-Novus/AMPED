# Manually run: downloads candidate music pages + files so their licences can be checked.
# Results go to a DRAFT release (visible to repository collaborators only), nothing is committed.
name: Fetch music candidates

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated OpenGameArt page URLs"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          URLS: ${{ inputs.urls }}
        run: python3 tools/fetch_music.py out $URLS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && zip -qr ../music-candidates.zip .)
          gh release view music-candidates >/dev/null 2>&1 || \
            gh release create music-candidates --draft --title "Music candidates (private draft)" --notes "Downloaded for licence review. Not for release."
          gh release upload music-candidates music-candidates.zip --clobber
